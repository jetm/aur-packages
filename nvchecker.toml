[__config__]
oldver = "old.json"
newver = "new.json"

[c]
source = "github"
github = "ryanmjacobs/c"
use_max_tag = true
prefix = "v"

[include-what-you-use]
source = "cmd"
cmd = "scripts/check-iwyu.sh"

[easy-conflict]
source = "github"
github = "chojs23/ec"
use_max_tag = true
prefix = "v"

[easy-conflict-bin]
source = "github"
github = "chojs23/ec"
use_max_tag = true
prefix = "v"

[git-add-interactive]
source = "github"
github = "cwarden/git-add--interactive"
use_max_tag = true
prefix = "v"

[nah-bin]
source = "github"
github = "manuelschipper/nah"
use_max_tag = true
prefix = "v"

[lavacli]
source = "gitlab"
gitlab = "lava/lavacli"
host = "gitlab.com"
use_max_tag = true
prefix = "v"

[pkgtrack]
source = "github"
github = "jetm/pkgtrack"
use_max_tag = true
prefix = "v"

[markless-bin]
source = "github"
github = "jvanderberg/markless"
use_max_tag = true
prefix = "v"

[ytcui]
source = "regex"
url = "https://raw.githubusercontent.com/MilkmanAbi/ytcui/main/VERSION"
regex = '[\d.]+'

[avocado-cli]
source = "github"
github = "avocado-linux/avocado-cli"
use_max_tag = true
# Upstream tags prereleases (1.0.0-rc.1) and junk backup/* refs; a hyphenated
# pkgver makes makepkg fail. Restrict to stable X.Y.Z tags only.
include_regex = "[0-9.]+"

[yocto-uninative-tarball]
source = "cmd"
cmd = "scripts/check-uninative.sh"

# Personal fork of CachyOS's linux-cachyos PKGBUILD (adds an XFS nofs patch and
# a -jetm package suffix so pacman's `Replaces: linux-cachyos-lto` cannot remove
# it). Tracks the SOURCE TARBALL repo, not CachyOS/linux-cachyos: the packaging
# repo's tags are stale (6.17.9 while the kernel is 7.1.5), whereas
# CachyOS/linux releases are exactly what _srcname consumes (cachyos-7.1.5-1).
# Tags there are inherited upstream Linux tags (v5.18-rc5...), so use releases.
# CachyOS does NOT flag rc releases as prerelease, so exclude them explicitly or
# this tracks 7.2-rc5 instead of 7.1.5.
[linux-cachyos-jetm]
source = "github"
github = "CachyOS/linux"
use_max_release = true
exclude_regex = ".*-rc[0-9]+-.*"
prefix = "cachyos-"

# Tags belong to the abandoned MFGTool 2.x line - v2.8.0 (2018) sorts highest, so
# use_max_tag resolves seven years behind the package. Real versions are releases,
# tagged uuu_X.Y.Z.
# use_latest_release, not use_max_release: NXP publishes prereleases in that same
# uuu_ namespace (1.5.239, 1.5.222 and a rolling "master" are all prerelease=true)
# and max_release would take the newest of those. Unlike CachyOS above, NXP does
# set the flag, so latest_release resolves to the newest stable.
[uuu]
source = "github"
github = "nxp-imx/mfgtools"
use_latest_release = true
prefix = "uuu_"

# Track releases, not tags: the packaged artifact is the Drata-Agent-linux.deb
# release asset, so a tag without a release would report a version whose .deb
# does not exist. use_latest_release is safe here because upstream sets the
# prerelease flag correctly (every release to date is prerelease=false) and
# GitHub marks 3.9.0 as latest. Tags carry no prefix.
[drata-agent-bin]
source = "github"
github = "drata/drata-agent"
use_latest_release = true

[reproc]
source = "github"
github = "DaanDeMeyer/reproc"
use_max_tag = true
prefix = "v"

# Personal fork of the AUR `slack-desktop-wayland`, which trails upstream.
# Tracks the AUR `slack-desktop` package rather than Slack's download page: both
# consume the same .deb, and ogarcia's bump is proof the URL for that version
# resolves. Slack publishes builds to the CDN before they are generally rolled
# out, so following the vendor directly would bump to a version whose .deb may
# 404. strip_release, or the AUR's pkgrel arrives as part of the version and
# makepkg rejects the hyphen in pkgver.
[slack-desktop-wayland-jetm]
source = "aur"
aur = "slack-desktop"
strip_release = true
