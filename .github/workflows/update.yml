name: Check & Update AUR packages

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # linux-cachyos-jetm is exempt from the build step, so the run opens an issue
  # to say a host rebuild is due.
  issues: write

jobs:
  check:
    name: Check for updates
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_updates: ${{ steps.detect.outputs.has_updates }}
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          pacman -Syu --noconfirm nvchecker

      - name: Run nvchecker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo -e "[keys]\ngithub = \"$GITHUB_TOKEN\"" > keyfile.toml
          nvchecker --file nvchecker.toml --keyfile keyfile.toml

      - name: Detect outdated packages
        id: detect
        run: |
          updates=$(nvcmp --file nvchecker.toml --json)
          echo "Raw nvcmp output: $updates"

          if [ "$updates" = "[]" ]; then
            echo "All packages up to date"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            # Build matrix: [{pkg: "name", version: "X.Y.Z"}, ...]
            matrix=$(echo "$updates" | python3 -c "
          import json, sys
          updates = json.load(sys.stdin)
          includes = [{'pkg': u['name'], 'version': u['newver']} for u in updates]
          print(json.dumps({'include': includes}))
          ")
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "Updates found: $matrix"
          fi

  update:
    name: Update ${{ matrix.pkg }}
    needs: check
    if: needs.check.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          pacman -Syu --noconfirm pacman-contrib openssh git

      - name: Setup build user
        run: |
          # makepkg and updpkgsums refuse to run as root
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Update package version
        run: |
          su builder -c "scripts/update-version.sh '${{ matrix.pkg }}' '${{ matrix.version }}'"

      # A PKGBUILD that declares validpgpkeys still needs those keys present in
      # the builder's keyring; a fresh container has none, so makepkg stops at
      # "unknown public key" before compiling anything. Read them from .SRCINFO
      # rather than parsing the PKGBUILD, and do not fail the job when a package
      # declares none or a keyserver is briefly unreachable - makepkg reports the
      # real verification result either way.
      - name: Import source-signing keys
        run: |
          su builder -c '
            set -u
            keys=$(grep -oP "^\tvalidpgpkeys = \K[0-9A-Fa-f]+" \
              "packages/${{ matrix.pkg }}/.SRCINFO" || true)
            [ -n "$keys" ] || { echo "no validpgpkeys declared"; exit 0; }
            for k in $keys; do
              echo "importing $k"
              gpg --keyserver keyserver.ubuntu.com --recv-keys "$k" \
                || gpg --keyserver keys.openpgp.org --recv-keys "$k" \
                || echo "warning: could not import $k"
            done
          '

      # linux-cachyos-jetm is exempt: it is a kernel, and a ThinLTO build with
      # debug symbols does not fit a hosted runner's disk or time. Nobody
      # consumes a binary from here anyway - the fleet builds it per host on
      # purpose, because CONFIG_X86_NATIVE_CPU compiles for the building CPU and
      # the machines are different microarchitectures. Publishing the updated
      # PKGBUILD is the useful half; whoever installs it builds it themselves,
      # which is how AUR works for any large package.
      - name: Build package
        if: matrix.pkg != 'linux-cachyos-jetm'
        run: |
          su builder -c "cd packages/${{ matrix.pkg }} && CI=1 makepkg --syncdeps --noconfirm --noarchive"

      - name: Publish to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_USER_NAME: ${{ secrets.AUR_USER_NAME }}
          AUR_USER_EMAIL: ${{ secrets.AUR_USER_EMAIL }}
        run: |
          scripts/publish.sh "${{ matrix.pkg }}"

      # The exemption above means nothing here proves the kernel still builds,
      # and the running machines are not updated by this workflow either. Raise
      # an issue so the bump is visible and someone rebuilds on each host - the
      # XFS patch in particular is pinned to a source tag and may not apply.
      - name: Open an issue for the local kernel rebuild
        if: matrix.pkg == 'linux-cachyos-jetm'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "linux-cachyos-jetm ${{ matrix.version }}: rebuild on each host" \
            --label kernel \
            --body "$(cat <<'EOF'
          nvchecker picked up a new CachyOS release and the PKGBUILD has been
          bumped and published to the AUR. CI does not build this package - see
          the exemption in `.github/workflows/update.yml` - so nothing has
          verified it compiles, and no machine has been updated.

          On each build host:

          ```bash
          git pull
          cd packages/linux-cachyos-jetm
          makepkg -si     # builds for THIS cpu; do not copy the result between hosts
          sudo reboot     # install and reboot together, see the pkgrel note in the PKGBUILD
          ```

          Check while you are there:

          - the XFS nofs patch is pinned to a source tag and carries a re-apply
            check; if it no longer applies, drop it if the fix has landed upstream
          - `pkgrel` is pinned to the distro package's, so confirm it still matches
            `linux-cachyos`
          EOF
          )"

      - name: Upload updated files
        uses: actions/upload-artifact@v7
        with:
          name: updated-${{ matrix.pkg }}
          path: |
            packages/${{ matrix.pkg }}/PKGBUILD
            packages/${{ matrix.pkg }}/.SRCINFO

  commit:
    name: Commit changes
    needs: [check, update]
    if: needs.check.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all updated packages
        uses: actions/download-artifact@v8
        with:
          pattern: updated-*
          merge-multiple: true

      - name: Update nvchecker state
        run: |
          # Merge new versions into old.json for packages that were updated
          matrix='${{ needs.check.outputs.matrix }}'
          echo "$matrix" | python3 -c "
          import json, sys

          matrix = json.load(sys.stdin)
          with open('old.json') as f:
              old = json.load(f)

          for entry in matrix.get('include', []):
              pkg = entry['pkg']
              ver = entry['version']
              old['data'][pkg] = {'version': ver}

          with open('old.json', 'w') as f:
              json.dump(old, f, indent=2)
              f.write('\n')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/ old.json
          git diff --cached --quiet && exit 0
          git commit -m "Update packages to latest upstream versions"
          git push
