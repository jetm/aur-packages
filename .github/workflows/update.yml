name: Check & Update AUR packages

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # linux-cachyos-jetm is exempt from the build step, so the run opens an issue
  # to say a host rebuild is due.
  issues: write

jobs:
  check:
    name: Check for updates
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_updates: ${{ steps.detect.outputs.has_updates }}
    steps:
      # Ahead of the checkout on purpose. archlinux:base-devel ships no git,
      # and actions/checkout silently falls back to downloading a REST-API
      # tarball when git is missing from PATH, leaving the workspace with no
      # .git directory. Nothing in this job reads git today, but the fallback
      # is quiet enough that whatever does next would fail somewhere far from
      # the cause - see the update job, where it cost a broken AUR push.
      - name: Install tools
        run: |
          pacman -Syu --noconfirm nvchecker git

      - uses: actions/checkout@v5

      - name: Run nvchecker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo -e "[keys]\ngithub = \"$GITHUB_TOKEN\"" > keyfile.toml
          nvchecker --file nvchecker.toml --keyfile keyfile.toml

      - name: Detect outdated packages
        id: detect
        run: |
          updates=$(nvcmp --file nvchecker.toml --json)
          echo "Raw nvcmp output: $updates"

          if [ "$updates" = "[]" ]; then
            echo "All packages up to date"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            # Build matrix: [{pkg: "name", version: "X.Y.Z"}, ...]
            matrix=$(echo "$updates" | python3 -c "
          import json, sys
          updates = json.load(sys.stdin)
          includes = [{'pkg': u['name'], 'version': u['newver']} for u in updates]
          print(json.dumps({'include': includes}))
          ")
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "Updates found: $matrix"
          fi

  update:
    name: Update ${{ matrix.pkg }}
    needs: check
    if: needs.check.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      # Ahead of the checkout on purpose, and git is the reason. Without it on
      # PATH, actions/checkout downloads a REST-API tarball instead of cloning
      # ("The repository will be downloaded using the GitHub REST API") and the
      # workspace ends up with no .git at all. That silently broke publish.sh,
      # which read a package's extra source files with `git ls-files`: the call
      # failed, the process substitution swallowed the failure, and the AUR
      # commit went out missing every patch.
      - name: Install tools
        run: |
          pacman -Syu --noconfirm pacman-contrib openssh git

      - uses: actions/checkout@v5

      - name: Setup build user
        run: |
          # makepkg and updpkgsums refuse to run as root
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      # matrix.pkg / matrix.version reach the shell through env, never through
      # ${{ }} interpolation. matrix.version comes from nvchecker, which for
      # most packages means an upstream-controlled git tag or release name -
      # interpolating it would let a tag containing a quote close the `su -c`
      # string and run arbitrary commands in a job that holds contents:write
      # and, three steps later, AUR_SSH_KEY. Only yocto-uninative-tarball's
      # check script constrains its version shape; nothing constrains the rest.
      #
      # `su -w` whitelists just these two variables across the privilege drop.
      # Plain `-m` would preserve the whole environment including root's HOME,
      # which makepkg needs to be the builder's.
      - name: Update package version
        env:
          PKG: ${{ matrix.pkg }}
          VERSION: ${{ matrix.version }}
        run: |
          su -w PKG,VERSION builder -c 'scripts/update-version.sh "$PKG" "$VERSION"'

      # A PKGBUILD that declares validpgpkeys still needs those keys present in
      # the builder's keyring; a fresh container has none, so makepkg stops at
      # "unknown public key" before compiling anything. Read them from .SRCINFO
      # rather than parsing the PKGBUILD, and do not fail the job when a package
      # declares none or a keyserver is briefly unreachable - makepkg reports the
      # real verification result either way.
      - name: Import source-signing keys
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          su -w PKG builder -c '
            set -u
            keys=$(grep -oP "^\tvalidpgpkeys = \K[0-9A-Fa-f]+" \
              "packages/$PKG/.SRCINFO" || true)
            [ -n "$keys" ] || { echo "no validpgpkeys declared"; exit 0; }
            for k in $keys; do
              echo "importing $k"
              gpg --keyserver keyserver.ubuntu.com --recv-keys "$k" \
                || gpg --keyserver keys.openpgp.org --recv-keys "$k" \
                || echo "warning: could not import $k"
            done
          '

      # linux-cachyos-jetm is exempt: it is a kernel, and a ThinLTO build with
      # debug symbols does not fit a hosted runner's disk or time. Nobody
      # consumes a binary from here anyway - the fleet builds it per host on
      # purpose, because CONFIG_X86_NATIVE_CPU compiles for the building CPU and
      # the machines are different microarchitectures. Publishing the updated
      # PKGBUILD is the useful half; whoever installs it builds it themselves,
      # which is how AUR works for any large package.
      - name: Build package
        if: matrix.pkg != 'linux-cachyos-jetm'
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          su -w PKG builder -c 'cd "packages/$PKG" && CI=1 makepkg --syncdeps --noconfirm --noarchive'

      - name: Publish to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_USER_NAME: ${{ secrets.AUR_USER_NAME }}
          AUR_USER_EMAIL: ${{ secrets.AUR_USER_EMAIL }}
          PKG: ${{ matrix.pkg }}
        run: |
          scripts/publish.sh "$PKG"

      # The exemption above means nothing here proves the kernel still builds,
      # and the running machines are not updated by this workflow either. Raise
      # an issue so the bump is visible and someone rebuilds on each host - the
      # XFS patch in particular is pinned to a source tag and may not apply.
      - name: Open an issue for the local kernel rebuild
        if: matrix.pkg == 'linux-cachyos-jetm'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          # The job runs in archlinux:base-devel, which has no gh. Install it
          # here rather than in the shared tools step so only this package pays
          # for it. No --label: a label that does not exist fails the call, and
          # the notification matters more than the tag.
          pacman -S --noconfirm --needed github-cli
          # --repo, so gh does not infer it from git: the checkout belongs to
          # builder while this step runs as root, and git refuses to read a tree
          # it considers unowned - which gh surfaces as "not a git repository".
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "linux-cachyos-jetm $VERSION: rebuild on each host" \
            --body "$(cat <<'EOF'
          nvchecker picked up a new CachyOS release and the PKGBUILD has been
          bumped and published to the AUR. CI does not build this package - see
          the exemption in `.github/workflows/update.yml` - so nothing has
          verified it compiles, and no machine has been updated.

          On each build host:

          ```bash
          git pull
          cd packages/linux-cachyos-jetm
          makepkg -si     # builds for THIS cpu; do not copy the result between hosts
          sudo reboot     # install and reboot together, see the pkgrel note in the PKGBUILD
          ```

          Check while you are there:

          - the XFS nofs patch is pinned to a source tag and carries a re-apply
            check; if it no longer applies, drop it if the fix has landed upstream
          - `pkgrel` is pinned to the distro package's, so confirm it still matches
            `linux-cachyos`
          EOF
          )"

      # An artifact is rooted at the least common ancestor of its paths, so this
      # one contains PKGBUILD/.SRCINFO at its root with no `packages/<pkg>/`
      # prefix. That is fine - the commit job puts them back (see there) - but
      # it is why the previous version silently failed: the download landed a
      # bare PKGBUILD at the workspace root, `git add packages/` staged nothing,
      # and every run committed old.json alone. The repo's PKGBUILD stayed at
      # the pre-bump version while old.json recorded the new one as done, so
      # nvchecker never retried and the AUR ran ahead of the repo indefinitely.
      #
      # Uploading the whole `packages/` tree instead would make the prefix
      # correct but is wrong under a matrix: every job would upload every
      # package, and merging those artifacts would clobber one job's bump with
      # another job's stale copy.
      #
      # include-hidden-files is required for .SRCINFO: upload-artifact has
      # excluded dotfiles by default since v4.4, so without it the AUR would
      # get a PKGBUILD whose .SRCINFO never moved.
      #
      # The excludes keep the ~500 MB of makepkg output (and the built package)
      # out of the artifact; they mirror what .gitignore already lists.
      - name: Upload updated files
        uses: actions/upload-artifact@v7
        with:
          name: updated-${{ matrix.pkg }}
          include-hidden-files: true
          path: |
            packages/${{ matrix.pkg }}/
            !packages/${{ matrix.pkg }}/pkg/
            !packages/${{ matrix.pkg }}/src/
            !packages/${{ matrix.pkg }}/glibc/
            !packages/${{ matrix.pkg }}/*.pkg.tar.*

  commit:
    name: Commit changes
    needs: [check, update]
    if: needs.check.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No merge-multiple: each artifact is rooted at its package directory, so
      # merging them into one place would collapse every package's PKGBUILD
      # onto the same path. Downloading into .artifacts/ keeps one
      # `updated-<pkg>/` subdirectory per artifact, which the next step maps
      # back to `packages/<pkg>/`.
      - name: Download all updated packages
        uses: actions/download-artifact@v8
        with:
          pattern: updated-*
          path: .artifacts

      # Driven by the matrix, not by globbing the download directory, because
      # download-artifact's layout depends on how many artifacts matched:
      # several get one `updated-<pkg>/` subdirectory each, but a single one is
      # extracted straight into `path` with no subdirectory at all. Globbing for
      # the subdirectories therefore found nothing whenever exactly one package
      # updated - which is the common case. Handle both, and say which layout
      # was used so a future change in that behaviour is visible in the log.
      - name: Restore updated files into the package tree
        env:
          MATRIX: ${{ needs.check.outputs.matrix }}
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(printf '%s' "$MATRIX" | python3 -c \
            "import json,sys; [print(e['pkg']) for e in json.load(sys.stdin).get('include', [])]")
          if ((${#pkgs[@]} == 0)); then
            echo "error: this job only runs when the check job found updates," >&2
            echo "  but the matrix lists no packages." >&2
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            if [[ -d ".artifacts/updated-$pkg" ]]; then
              src=".artifacts/updated-$pkg"
            elif ((${#pkgs[@]} == 1)); then
              src=".artifacts"
            else
              echo "error: no artifact directory for '$pkg' and more than one" >&2
              echo "  package updated, so the flat layout cannot be assumed." >&2
              exit 1
            fi
            # The layout assumption above is the thing most likely to change
            # under us; assert on it rather than silently copying an empty tree.
            if [[ ! -f "$src/PKGBUILD" ]]; then
              echo "error: '$src' contains no PKGBUILD - artifact layout changed" >&2
              ls -la "$src" >&2 || true
              exit 1
            fi
            cp -a "$src/." "packages/$pkg/"
            echo "restored $pkg from $src"
          done
          rm -rf .artifacts

      - name: Update nvchecker state
        run: |
          # Merge new versions into old.json for packages that were updated
          matrix='${{ needs.check.outputs.matrix }}'
          echo "$matrix" | python3 -c "
          import json, sys

          matrix = json.load(sys.stdin)
          with open('old.json') as f:
              old = json.load(f)

          for entry in matrix.get('include', []):
              pkg = entry['pkg']
              ver = entry['version']
              old['data'][pkg] = {'version': ver}

          with open('old.json', 'w') as f:
              json.dump(old, f, indent=2)
              f.write('\n')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/ old.json
          # Say so rather than exiting 0 into silence: this job only runs when
          # the check job found updates, so "nothing staged" means the restore
          # step or the artifact contract is broken, not that there was no work.
          if git diff --cached --quiet; then
            echo "error: updates were detected but nothing is staged;" >&2
            echo "  the PKGBUILD bump did not survive the artifact round-trip." >&2
            exit 1
          fi
          git commit -m "Update packages to latest upstream versions"
          git push
